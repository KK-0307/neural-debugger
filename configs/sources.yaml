# Fixed initial corpus ("nd-corpus-v1"). Every entry is pinned: changing a page list or a
# version produces a different corpus and must bump corpus_id.
corpus_id: nd-corpus-v1
user_agent: "NeuralDebuggerResearch/0.1 (portfolio project; contact kayanm7302@gmail.com)"
request_delay_seconds: 1.0

