  - name: fastapi
    framework: fastapi
    version: "0.162.0"
    kind: git_markdown
    repo: https://github.com/fastapi/fastapi
    ref: "0.162.0"
    commit: 7a0a3f0b286c6c865cf4398ea0e957a87b8bffa4
    docs_dir: docs/en/docs
