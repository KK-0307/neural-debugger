name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI deliberately needs no secrets: no paid LLM calls, no model training.
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra data --extra index
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: |
          uv run mypy -p neural_debugger
          uv run mypy tests
      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          load: true
          tags: nd-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: |
          size=$(docker image inspect nd-backend:ci --format '{{.Size}}')
          echo "backend image: $((size / 1024 / 1024)) MiB"
          echo "backend image: $((size / 1024 / 1024)) MiB" >> "$GITHUB_STEP_SUMMARY"
          # guard against the CUDA wheels sneaking back in (CPU-only torch is ~1 GiB with the retrieval stack)
          test "$size" -lt $((3 * 1024 * 1024 * 1024))
      - name: No secrets in the image
        run: |
          # explicit `if`s: under `set -e` a failing `! pipeline` does not stop the step
          if docker run --rm --entrypoint sh nd-backend:ci -c 'ls -A /app | grep -E "^\.env"'; then
            echo "a .env file is inside the image"; exit 1
          fi
          if docker image inspect nd-backend:ci --format '{{json .Config.Env}}' | grep -iE 'api[_-]?key|secret|password|token'; then
            echo "a secret-like variable is baked into the image environment"; exit 1
          fi
          if docker history --no-trunc nd-backend:ci | grep -E 'GEMINI_API_KEY|ANTHROPIC_API_KEY|AIza[0-9A-Za-z_-]{20,}'; then
            echo "a credential name or key is in the image history"; exit 1
          fi
      - name: Smoke test - provider configured (mock OpenAI-compatible server inside the container)
        run: |
          docker run -d --name nd -p 8000:8000 \
            -e ND_LLM_PROVIDER=openai_compatible -e ND_LLM_BASE_URL=http://127.0.0.1:8765 -e ND_LLM_MODEL=mock \
            nd-backend:ci sh -c "python -m neural_debugger.rag.mock_server --port 8765 & exec uvicorn neural_debugger.backend.main:app --host 0.0.0.0 --port 8000"
          python3 scripts/smoke_debug.py http://127.0.0.1:8000 || { docker logs nd; exit 1; }
          docker rm -f nd
      - name: Smoke test - no provider configured gives an informative 503
        run: |
          docker run -d --name nd -p 8000:8000 nd-backend:ci
          python3 scripts/smoke_debug.py http://127.0.0.1:8000 --expect-unconfigured || { docker logs nd; exit 1; }
          docker rm -f nd
      - name: Build full-stack image (API + exported frontend in one container, what free hosts run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/fullstack.Dockerfile
          push: false
          load: true
          tags: nd-fullstack:ci
          cache-from: type=gha,scope=fullstack
          cache-to: type=gha,scope=fullstack,mode=max
      - name: Full-stack container inside a 512 MB limit (smallest free tier) - site, config, privacy, limits
        run: |
          docker run -d --name ndfull --memory=512m --memory-swap=512m -p 8000:8000 \
            -e ND_DEMO_MODE=readonly -e ND_DEMO_RATE_PER_MINUTE=8 \
            -e ND_LLM_PROVIDER=openai_compatible -e ND_LLM_BASE_URL=http://127.0.0.1:8765 -e ND_LLM_MODEL=mock \
            nd-fullstack:ci sh -c "python -m neural_debugger.rag.mock_server --port 8765 & exec uvicorn neural_debugger.backend.main:app --host 0.0.0.0 --port 8000"
          python3 scripts/smoke_public.py http://127.0.0.1:8000 --answers 1 --check-limits --wait 180 || { docker logs ndfull; exit 1; }
          oom=$(docker inspect -f '{{.State.OOMKilled}}' ndfull)
          stat=$(docker exec ndfull cat /sys/fs/cgroup/memory.stat 2>/dev/null | grep -E '^(anon|file) ' | tr '\n' ' ')
          echo "OOMKilled=$oom  cgroup: $stat"
          echo "full-stack container in 512 MB: OOMKilled=$oom; $stat" >> "$GITHUB_STEP_SUMMARY"
          docker stats --no-stream ndfull
          docker rm -f ndfull
          test "$oom" = "false"
      - name: No secrets in the full-stack image
        run: |
          if docker run --rm --entrypoint sh nd-fullstack:ci -c 'ls -A /app | grep -E "^\.env"'; then echo "a .env file is inside the image"; exit 1; fi
          if docker image inspect nd-fullstack:ci --format '{{json .Config.Env}}' | grep -iE '(api[_-]?key|secret|password|_token)='; then echo "a credential-like variable is baked into the image"; exit 1; fi
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
