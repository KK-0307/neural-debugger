[project]
name = "neural-debugger"
version = "0.1.0"
description = "AI debugging assistant: custom PyTorch transformer retrieval + hybrid search + RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "httpx>=0.27",  # LLM provider HTTP client (Milestone 5)
]

[project.optional-dependencies]
# Optional extras keep the backend image and backend CI light.
# `data`: documentation ingestion pipeline + BM25 evaluation.
data = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "numpy>=1.26",
]
# `neural`: pretrained dense retriever, FAISS index, cross-encoder reranker (Milestone 3).
neural = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "torch>=2.4",
    "numpy>=1.26",
]
# `index`: just the vector index (no torch), enough for the index/RRF unit tests.
index = [
    "faiss-cpu>=1.8",
    "numpy>=1.26",
]
# `ml`: custom transformer + contrastive training (Milestone 4); independent of the pretrained stack.
ml = [
    "torch>=2.4",
    "numpy>=1.26",
    "tokenizers>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "scikit-learn>=1.5",  # independent reference implementation for metric tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_debugger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put src/ on the path explicitly: on macOS, files under a synced Desktop/.venv can gain the
# "hidden" flag and Python then silently skips the editable-install .pth file (see docs).
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",  # any new warning fails the run, so it cannot go unnoticed
    # Known and understood (docs/technical-decisions.md, "Starlette TestClient warning"):
    # emitted once at import of fastapi.testclient because Starlette prefers httpx2 over httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient",
]
markers = [
    "integration: needs a real PostgreSQL (DATABASE_URL_TEST); skipped otherwise",
    "model: needs sentence-transformers and the pinned Hugging Face models in the local cache; skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
# Line length is enforced by `ruff format`; it cannot wrap long string literals/docstring examples.
ignore = ["E501", "N812"]  # N812: `torch.nn.functional as F` is the universal convention

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses: safe as default argument values.
extend-immutable-calls = [
    "neural_debugger.data.chunking.ChunkingConfig",
    "neural_debugger.ml.retrieval.bm25.BM25Config",
    "neural_debugger.ml.retrieval.tokenizer.TokenizerConfig",
]

[tool.ruff.lint.isort]
known-first-party = ["neural_debugger"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch.*", "sklearn.*", "tokenizers.*", "bs4.*", "lxml.*", "sentence_transformers.*", "faiss.*", "huggingface_hub.*"]
ignore_missing_imports = true


[[tool.mypy.overrides]]
# torch.nn.Module.__call__ is typed Any in the stubs available here; tensors flow through unchanged.
module = ["neural_debugger.ml.transformer.*", "neural_debugger.ml.training.*"]
warn_return_any = false
disallow_untyped_calls = false  # torch autograd entry points (e.g. Tensor.backward) are untyped
# CI type-checks without PyTorch installed, where nn.Module and torch.no_grad() resolve to Any
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["tests.ml.test_transformer", "tests.ml.test_training"]
disallow_untyped_calls = false  # Tensor.backward is untyped in the installed torch stubs

[[tool.mypy.overrides]]
# RAG tests drive duck-typed fakes (ScriptedProvider | ExtractiveProvider, optional answer fields) and
# deliberately poke at partially-built objects; production code under src/ is still checked strictly.
module = ["tests.rag.*", "tests.backend.test_debug_api"]
disable_error_code = ["union-attr", "func-returns-value", "operator", "arg-type", "no-untyped-call"]
warn_unused_ignores = false
